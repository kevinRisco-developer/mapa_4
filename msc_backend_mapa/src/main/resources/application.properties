spring.application.name=backend

# Perfil "local" activo por defecto: hace que application-local.properties
# (gitignored, con la URI real de Mongo) se cargue en tu maquina.
spring.profiles.default=local

server.port=8080

# Configuracion del servidor real: se monta como volumen en
# /opt/data/interoperabilidad-backend/properties/backend.properties (ver
# docker/backend/backend.properties.example para el formato esperado).
# "optional:" evita que falle si el archivo no existe (desarrollo local).
spring.config.import=optional:file:/opt/data/interoperabilidad-backend/properties/backend.properties

app.mongodb.database=miApp

# Origen permitido para CORS y para el handshake de STOMP/SockJS.
# En el servidor real esto lo sobreescribe backend.properties con el dominio real del frontend.
app.cors.allowed-origin=http://localhost:4201

# RabbitMQ (local: docker/docker-compose.yml). En el servidor real esto lo
# sobreescribe backend.properties con el host/credenciales reales.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5900
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# Un solo consumidor, sin prefetch, para garantizar orden FIFO global
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
