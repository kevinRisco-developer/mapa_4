spring.application.name=backend

# Perfil "local" activo por defecto: hace que application-local.properties
# (gitignored, con la URI real de Mongo) se cargue en tu maquina. En Railway
# ese archivo no existe, no pasa nada, y las variables de entorno de Railway
# siempre tienen prioridad sobre cualquier archivo de properties de todas formas.
spring.profiles.default=local

# Puerto HTTP: Railway inyecta PORT en runtime; 8080 es el default local.
server.port=${PORT:8080}

# Mongo: la URI es obligatoria via variable de entorno (Railway) o via
# application-local.properties (dev local) - sin default aqui a proposito,
# para no volver a commitear la credencial real.
spring.mongodb.uri=${MONGODB_URI}
app.mongodb.database=${MONGODB_DATABASE:miApp}

# Origen permitido para CORS y para el handshake de STOMP/SockJS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4201}

# RabbitMQ (local: docker-compose.yml en la raiz del proyecto; Railway: servicio propio)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5900}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# Un solo consumidor, sin prefetch, para garantizar orden FIFO global
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

