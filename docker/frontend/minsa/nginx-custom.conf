server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (hoy el proyecto no usa Angular Router, pero queda listo para cuando se agregue).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|ico|svg|png|jpg|jpeg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
